name: Verificações

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-local-only
          POSTGRES_DB: watched_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d watched_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test-local-only@127.0.0.1:5432/watched_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l api internal worker)"
      - run: go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps --only-shell chromium
      - run: go test -tags=integration -race -count=1 ./...
      - run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    env:
      SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      POSTGRES_PASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-local-only
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-local-only
          APP_DOMAIN: watched.example.invalid
      - run: docker compose -f deploy/compose.yaml up --build -d --wait
        env:
          POSTGRES_PASSWORD: ci-local-only
      - run: curl --fail http://127.0.0.1:8080/api/readyz
      - run: curl --fail http://127.0.0.1:8080/
      - run: docker compose -f deploy/compose.yaml exec -T worker /app/playwright screenshot --browser chromium http://web/ /tmp/smoke.png
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
        env:
          POSTGRES_PASSWORD: ci-local-only
