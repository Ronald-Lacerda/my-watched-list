name: my-watched-list

x-go: &go
  image: my-watched-list-go:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend

x-app-env: &app-env
  DATABASE_URL: "postgres://${POSTGRES_USER:-watched}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-watched}?sslmode=disable"
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watched}
      POSTGRES_DB: ${POSTGRES_DB:-watched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *go
    command: [/app/migrate, up]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *go
    command: [/app/api]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/readyz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    init: true

  worker:
    <<: *go
    command: [/app/worker]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
