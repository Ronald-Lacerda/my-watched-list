# Banco isolado e descartável; nenhuma credencial de uso real.
name: my-watched-list-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-local-only
      POSTGRES_DB: watched_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d watched_test]
      interval: 2s
      timeout: 3s
      retries: 20
